  <title id="type-model-title">Discount module type model</title>
  <desc id="type-model-desc">DiscountCalculator accepts a Cart and a campaign collection and returns DiscountResult; five sealed records inherit Campaign in three categories, and Campaign computes a discount using DiscountContext containing Cart and RunningTotal.</desc>
